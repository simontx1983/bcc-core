name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — PHPStan L8 · PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Matches production and staging (8.3.30). Was '8.2' with nothing
          # depending on it — see docs/environment.md: a green check from the
          # one environment that does not match production is false confidence.
          php-version: '8.3'
          # gmp is required by EthSignatureVerifier (secp256k1 ecrecover).
          # pdo_sqlite runs the §F-02 visibility clause for real in
          # PostVisibilityLevelSqlAgreementTest, which FAILS rather than
          # skips in Actions when it is missing.
          extensions: mbstring, gmp, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=4G

      - name: Unit tests
        run: composer test
