name: Deploy

# Commit-driven deploy (replaces Git Updater's version-header polling, which
# silently skipped un-bumped merges — see the umbrella deploy-runbook).
#
#   staging    — automatic, AFTER the CI workflow succeeds on a push to main.
#   production — manual only (workflow_dispatch → environment: production),
#                so prod stays a deliberate promotion. The job now declares
#                the GitHub `environment:` too, so protection rules (required
#                reviewers / wait timers) engage once the environment is
#                configured — previously the input was gate-shaped but gated
#                nothing (2026-08-05 hardening).
#
# Plugin-scoped rsync: only wp-content/plugins/bcc-core/ is touched, so the
# webroot .htaccess (incl. the LSCache Authorization block), uploads/, and
# wp-config.php are never in range. vendor/ is committed, so there is no build
# step — the checked-out tree is the deploy artifact.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      expected_sha:
        description: "REQUIRED for production: the full 40-character commit SHA approved for deploy"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Serialize deploys per environment; never interrupt an in-flight rsync.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}-bcc-core
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch always runs; workflow_run only for a GREEN push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # A hung ssh/rsync must not hold the per-env concurrency lock for GitHub's
    # 6-hour default.
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      PLUGIN: bcc-core
    steps:
      - name: Resolve target
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            REF="${{ github.ref }}"
            # Production is promoted from main ONLY — a dispatch from a
            # feature branch must never ship unreviewed code to prod
            # (2026-08-05 hardening; previously any ref deployed).
            if [ "$ENVIRONMENT" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::production deploys must be dispatched from main (got ${{ github.ref }})"
              exit 1
            fi
          else
            ENVIRONMENT="staging"
            REF="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ "$ENVIRONMENT" = "production" ]; then
            SUBPATH="wp-content/plugins/$PLUGIN"
          else
            SUBPATH="stage/wp-content/plugins/$PLUGIN"
          fi
          {
            echo "environment=$ENVIRONMENT"
            echo "ref=$REF"
            echo "subpath=$SUBPATH"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $PLUGIN @ $REF → $ENVIRONMENT ($SUBPATH)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.ref }}

      # ⚠⚠ THE PRODUCTION RACE GUARD — asserts the CHECKED-OUT COMMIT, not
      # the current value of main.
      #
      # A production dispatch resolves REF to `refs/heads/main`; there is no
      # SHA input upstream of this step. And `concurrency` serialises deploys
      # with cancel-in-progress: false, so a dispatch can QUEUE behind an
      # in-flight deploy and check out main at an arbitrary later time. No
      # out-of-band read of main before dispatching can bound that window —
      # which is why a procedural re-read is not a substitute for this step.
      #
      # Once checkout has run, the bytes that will be rsynced are fixed, so
      # verifying THOSE is race-free regardless of what main does next.
      #
      # Placed immediately after checkout and BEFORE `Set up SSH`, so a
      # refusal happens with no deploy key written and no connection to the
      # host. Staging is untouched: the `if` gates on production, and the
      # workflow_run auto-deploy passes no inputs at all.
      #
      # ⚠ expected_sha arrives through `env`, never interpolated into the
      # script body — a ${{ }} expansion inside `run:` is a shell-injection
      # seam for anyone who can dispatch the workflow.
      - name: Refuse unless the checked-out commit is the approved SHA
        if: steps.t.outputs.environment == 'production'
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          EXPECTED="$EXPECTED_SHA"
          if [ -z "$EXPECTED" ]; then
            echo "::error::production deploys require expected_sha (the approved full 40-character commit SHA)"
            exit 1
          fi
          if [ ${#EXPECTED} -ne 40 ]; then
            echo "::error::expected_sha must be a FULL 40-character SHA (got ${#EXPECTED} characters)"
            exit 1
          fi
          case "$EXPECTED" in
            *[!0-9a-f]*)
              echo "::error::expected_sha must be 40 lowercase hexadecimal characters"
              exit 1
              ;;
          esac
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::REFUSING TO DEPLOY — checked-out HEAD $ACTUAL does not match the approved $EXPECTED. main moved between approval and dispatch."
            exit 1
          fi
          echo "Approved commit confirmed: $ACTUAL"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a PINNED host key (secret DEPLOY_HOST_KEY, captured once via
          # `ssh-keyscan -p PORT HOST`): zero network, zero flake, and real
          # MITM protection — re-scanning on every run made
          # StrictHostKeyChecking=yes theater. Fallback: retried keyscan (the
          # single un-retried scan failed ~50% of dispatches on this host;
          # stderr was also discarded, which is why it never self-explained).
          HK="${{ secrets.DEPLOY_HOST_KEY }}"
          if [ -n "$HK" ]; then
            printf '%s\n' "$HK" > ~/.ssh/known_hosts
          else
            for i in 1 2 3 4 5; do
              ssh-keyscan -T 10 -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts && [ -s ~/.ssh/known_hosts ] && break
              echo "keyscan attempt $i failed" >&2
              sleep 2
            done
            [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan produced no host key after 5 attempts"; exit 1; }
          fi

      - name: Deploy (plugin-scoped rsync, delayed delete + updates)
        run: |
          SUBPATH="${{ steps.t.outputs.subpath }}"
          # Belt-and-braces: an empty subpath would point --delete at
          # DEPLOY_BASE itself.
          test -n "$SUBPATH" || { echo "::error::empty deploy subpath"; exit 1; }
          TARGET="${{ secrets.DEPLOY_BASE }}/$SUBPATH"
          echo "rsync → ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$TARGET"
          # --delay-updates stages changed files and renames them into place in
          # one final sweep; --delete-delay defers deletions until after that
          # sweep. Collapses the mixed-tree window from the full transfer
          # duration to a sub-second rename pass — the window that produced
          # cross-plugin fatals mid-deploy (2026-08-05 incident).
          rsync -az --delete --delete-delay --delay-updates \
            --exclude='.git' --exclude='.github' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$TARGET/"

      - name: Confirm deployed version
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "grep -m1 'Version:' '${{ secrets.DEPLOY_BASE }}/${{ steps.t.outputs.subpath }}/$PLUGIN.php'"

      - name: Health probe (whole plugin trio)
        run: |
          # Hosts come from repo variables so the domain cutover (WP moving
          # off the apex to cms.*) is a settings change, not a timed merge
          # across three repos.
          #
          # The production fallback is now cms., POST-cutover. It used to be the
          # apex, which is a trap: the apex is the Vercel frontend and returns
          # 403 on /wp-json — and 403 was in this probe's accept list. So if
          # PROD_HEALTH_BASE were ever cleared, every production probe would
          # have hit the wrong host, got 403, and reported OK. Measured
          # 2026-10-29: all three paths below answer 403 on the apex and 200 on
          # cms., with and without redirect following.
          if [ "${{ steps.t.outputs.environment }}" = "production" ]; then
            BASE="${{ vars.PROD_HEALTH_BASE || 'https://cms.bluecollarcrypto.io' }}"
          else
            BASE="${{ vars.STAGE_HEALTH_BASE || 'https://stage.bluecollarcrypto.io' }}"
          fi
          # Probes SIBLING plugins too: bcc-search registers under the shared
          # bcc/v1 namespace, so only a plugin-owned ROUTE reveals a
          # deactivated/fataled plugin (404 = route gone, 5xx = fatal). This
          # step would have caught the 2026-08-05 bcc-search deactivation in
          # seconds instead of via user report.
          #
          # 200 ONLY, matching bcc-trust. The old accept list included
          # 400/401/403 as "route alive, enforcing its own rules" — tolerable
          # when BASE was the apex, which 403s every /wp-json request by design.
          # With BASE correctly cms., a 403 here means WP REST is genuinely
          # broken, and accepting it would let the probe pass through exactly
          # the outage it exists to catch. All three routes below are public
          # reads and return 200 on both environments today (measured
          # 2026-10-29); if one ever needs auth, probe a public route from that
          # plugin instead of widening this list.
          probe () {
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$BASE$1")
            case "$code" in
              200) echo "OK   $code $1" ;;
              *) echo "::error::FAIL $code $1 (403=REST blocked/wrong host, 404=route gone/plugin deactivated, 5xx=fatal, 000=unreachable)"; exit 1 ;;
            esac
          }
          probe "/wp-json/bcc/v1/ranks"
          probe "/wp-json/bcc/v1/search/groups?q=ping"
          probe "/wp-json/bcc/v1/cards?per_page=1"
